<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rdv WASM spike</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; max-width: 760px; }
  pre { background: #f2f2f2; padding: 8px; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
  button { padding: 8px 12px; font-size: 15px; margin: 4px 4px 4px 0; }
</style>
</head>
<body>
<h1>rdv patient core in WASM</h1>
<p>Throwaway spike for docs/superpowers/spikes/2026-11-wasm-patient.md. Test values only.</p>
<button id="checks">1. Correctness checks</button>
<button id="pow">2. PoW rate (difficulty 16, until 2^22 hashes)</button>
<button id="copy">Copy report</button>
<pre id="out"></pre>
<script type="module">
import init, * as spike from "./pkg/wasm_patient_spike.js";
const REFERENCE = "ebb6389f502f731df36fa1c37df1d08ad9518165f90f2f71682b8d7af294b817";
const lines = [];
const log = (s) => { lines.push(s); document.getElementById("out").textContent = lines.join("\n"); };
await init();
log("userAgent: " + navigator.userAgent);
document.getElementById("checks").onclick = () => {
  const r1 = spike.random_hex_rand010(), r2 = spike.random_hex_rand010();
  const s1 = spike.random_hex_secp(), s2 = spike.random_hex_secp();
  log("rand 0.10 (getrandom 0.4.3): " + (r1 !== r2 ? "two different values" : "SAME VALUE TWICE") + " " + r1);
  log("secp256k1 rand (getrandom 0.3.4): " + (s1 !== s2 ? "two different values" : "SAME VALUE TWICE") + " " + s1);
  log("seal/open roundtrip: " + spike.seal_open_roundtrip());
  const p = spike.pseudonym_from_entropy("00".repeat(32), "02" + "11".repeat(32));
  log("pseudonym: " + (p === REFERENCE ? "matches native reference" : "DIFFERS from native reference " + p));
};
document.getElementById("pow").onclick = () => {
  let hashes = 0, ms = 0, runs = 0;
  while (hashes < 2 ** 22) {
    const r = JSON.parse(spike.mine_rate(16));
    hashes += r.nonce + 1; ms += r.ms; runs += 1;
  }
  const rate = hashes / (ms / 1000);
  log("PoW: " + runs + " runs, " + hashes + " hashes in " + ms.toFixed(0) + " ms = " + rate.toFixed(0) + " hashes/s");
  for (const d of [16, 18, 20, 22]) log("  expected time at difficulty " + d + ": " + (2 ** d / rate).toFixed(2) + " s");
};
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(lines.join("\n")); log("(report copied)"); } catch (e) { log("copy failed: " + e); }
};
</script>
</body>
</html>
