<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>PRF probe</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; max-width: 760px; }
  button { margin: 4px 4px 4px 0; padding: 8px 12px; font-size: 15px; }
  pre { background: #f2f2f2; padding: 8px; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
</style>
</head>
<body>
<h1>WebAuthn PRF probe</h1>
<p>Throwaway probe for docs/superpowers/spikes/2026-11-prf-navigateurs.md. Test values only.</p>
<button id="caps">1. Capabilities</button>
<button id="reg">2. Register (saltA)</button>
<button id="getA">3. Get saltA</button>
<button id="getB">4. Get saltB</button>
<button id="getBy">5. evalByCredential (two credentials)</button>
<button id="copy">Copy report</button>
<button id="reset">Forget stored reference</button>
<pre id="out"></pre>
<script>
"use strict";
// Same salts as the 2026-09-02 spike: "salt-A-" + 25 x "0", "salt-B-" + 25 x "1".
const enc = new TextEncoder();
const saltA = enc.encode("salt-A-" + "0".repeat(25));
const saltB = enc.encode("salt-B-" + "1".repeat(25));
const UV = "required";
const KEY = "rdv-prf-probe";
const lines = [];

const hex = (buf) => buf ? Array.from(new Uint8Array(buf), (b) => b.toString(16).padStart(2, "0")).join("") : null;
const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || { credentials: [], refA: null }; }
  catch (e) { return { credentials: [], refA: null }; }
}
function save(state) {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { log("localStorage unavailable: " + e); }
}
function log(s) { lines.push(s); document.getElementById("out").textContent = lines.join("\n"); }

function header() {
  log("userAgent: " + navigator.userAgent);
  log("display-mode standalone: " + window.matchMedia("(display-mode: standalone)").matches);
  log("navigator.standalone (iOS): " + (navigator.standalone === undefined ? "undefined" : navigator.standalone));
  log("origin: " + location.origin + " / rpId: " + location.hostname);
  log("userVerification: " + UV);
}

function compareA(out) {
  const state = load();
  if (!out) return "no output";
  if (!state.refA) { state.refA = out; save(state); return "stored as reference"; }
  return out === state.refA ? "IDENTICAL to stored reference" : "DIFFERENT from stored reference " + state.refA;
}

async function caps() {
  if (!window.PublicKeyCredential) { log("caps: PublicKeyCredential absent"); return; }
  try {
    if (PublicKeyCredential.getClientCapabilities) {
      log("getClientCapabilities: " + JSON.stringify(await PublicKeyCredential.getClientCapabilities()));
    } else { log("getClientCapabilities: not implemented"); }
    log("isUVPAA: " + await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
  } catch (e) { log("caps error: " + e.name + ": " + e.message); }
}

async function register() {
  const userId = crypto.getRandomValues(new Uint8Array(16));
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      rp: { id: location.hostname, name: "rdv probe" },
      user: { id: userId, name: "rdv-probe", displayName: "rdv probe" },
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
      authenticatorSelection: { residentKey: "required", userVerification: UV },
      extensions: { prf: { eval: { first: saltA } } },
    }});
    const prf = cred.getClientExtensionResults().prf || {};
    const first = prf.results ? hex(prf.results.first) : null;
    log("create: ok, credential " + b64u(cred.rawId));
    log("create prf.enabled: " + prf.enabled + ", results.first: " + first + (first ? " (" + first.length / 2 + " bytes)" : ""));
    const state = load();
    state.credentials.push(b64u(cred.rawId));
    save(state);
    if (first) log("create saltA: " + compareA(first));
  } catch (e) { log("create error: " + e.name + ": " + e.message); }
}

async function get(salt, label) {
  try {
    const assertion = await navigator.credentials.get({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rpId: location.hostname,
      userVerification: UV,
      extensions: { prf: { eval: { first: salt } } },
    }});
    const prf = assertion.getClientExtensionResults().prf || {};
    const out = prf.results ? hex(prf.results.first) : null;
    log("get " + label + ": credential " + b64u(assertion.rawId) + ", output " + out + (out ? " (" + out.length / 2 + " bytes)" : ""));
    if (label === "saltA") log("get saltA: " + compareA(out));
  } catch (e) { log("get " + label + " error: " + e.name + ": " + e.message); }
}

async function getBy() {
  const state = load();
  if (state.credentials.length < 2) { log("evalByCredential: register two credentials first (have " + state.credentials.length + ")"); return; }
  const evalByCredential = {};
  state.credentials.slice(-2).forEach((id, i) => { evalByCredential[id] = { first: i === 0 ? saltA : saltB }; });
  try {
    const assertion = await navigator.credentials.get({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rpId: location.hostname,
      userVerification: UV,
      allowCredentials: state.credentials.slice(-2).map((id) => ({ type: "public-key", id: unb64u(id) })),
      extensions: { prf: { evalByCredential } },
    }});
    const prf = assertion.getClientExtensionResults().prf || {};
    log("evalByCredential: credential " + b64u(assertion.rawId) + ", output " + (prf.results ? hex(prf.results.first) : null));
  } catch (e) { log("evalByCredential error: " + e.name + ": " + e.message); }
}

document.getElementById("caps").onclick = caps;
document.getElementById("reg").onclick = register;
document.getElementById("getA").onclick = () => get(saltA, "saltA");
document.getElementById("getB").onclick = () => get(saltB, "saltB");
document.getElementById("getBy").onclick = getBy;
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(lines.join("\n")); log("(report copied)"); }
  catch (e) { log("copy failed, select the text manually: " + e); }
};
document.getElementById("reset").onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} log("reference forgotten"); };
header();
</script>
</body>
</html>
